name: Observatory source watch
on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: observatory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-watch.txt

      - name: Run source watch
        run: |
          mkdir -p state
          python watch.py

      - name: Commit results
        run: |
          git config user.name "observatory-watch"
          git config user.email "contact@aitransparencyinstitute.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "watch: $(date -u +%F)"
          git pull --rebase origin main
          git push origin main

      - name: Deploy observatory-data.json to the website
        if: ${{ env.FTP_HOST != '' }}
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
            -e "set ssl:verify-certificate no; cd $FTP_DIR; put observatory-data.json; bye"