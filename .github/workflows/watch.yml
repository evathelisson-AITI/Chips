# Observatory source watch.
# Runs watch.py and prevalidate.py from the repo (no embedded copies), opens a
# GitHub issue for the curator when there are new candidates, and commits the
# watch outputs. With auto_publish_mode "off" (config.json) it never touches
# observatory-data.json. The machine never sets ver to VERIFIED or REPORTED.
# The site deploys from git on Vercel; there is no separate upload step.
#
# Security layout: two jobs.
#   watch   - read-only token. Installs third-party packages (hash-pinned) and
#             processes untrusted feed content. Hands its output files over as an
#             artifact.
#   publish - may write to the repo and open issues, but runs no third-party
#             code: it copies only the expected data files from the artifact,
#             regenerates app.js's snapshot itself (stdlib script from the repo),
#             and pushes. A compromised dependency or feed parser in "watch"
#             therefore never sees a write token and cannot ship JavaScript.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
name: Observatory source watch
on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC, weekly
  workflow_dispatch: {}

permissions: {}   # each job asks for what it needs

concurrency:
  group: observatory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements-watch.txt

      # Keep the page's fallback snapshot in step with curator edits to the data,
      # so the seed-freshness test below passes. (publish regenerates it again.)
      - name: Refresh the embedded seed snapshot
        run: python update_seed.py

      - name: Offline tests
        run: |
          python -m unittest discover tests
          node tests/test_render.mjs

      - name: Run source watch
        run: python watch.py

      - name: Pre-validate (suggestions only, never touches ver)
        run: python prevalidate.py --hints primary_hints.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-output
          if-no-files-found: error
          retention-days: 7
          path: |
            state/seen.json
            state/stories.json
            candidates.json
            DIGEST.md
            prevalidation.json
            PREVALIDATION.md
            observatory-data.json

  publish:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit state/seen.json and the digest
      issues: write     # open the review issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the token is passed to the one push below only

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: watch-output
          path: ${{ runner.temp }}/watch-output

      # Take only the expected files, each of which must be valid JSON or plain
      # text. Nothing else from the artifact reaches the repository.
      - name: Copy watch outputs
        env: { OUT: "${{ runner.temp }}/watch-output" }
        run: |
          set -euo pipefail
          for f in state/seen.json state/stories.json candidates.json prevalidation.json observatory-data.json; do
            jq -e . "$OUT/$f" > /dev/null
            install -D -m 644 "$OUT/$f" "$f"
          done
          for f in DIGEST.md PREVALIDATION.md; do
            install -D -m 644 "$OUT/$f" "$f"
          done
          python3 update_seed.py   # app.js is rebuilt here, never taken from the artifact

      # Issue BEFORE commit: if the issue fails, the job fails and state/seen.json
      # is not committed, so the items come back next run.
      - name: Open a review issue for the curator
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          COUNT=$(jq length candidates.json)
          echo "candidates=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            {
              head -c 30000 DIGEST.md
              echo
              echo "---"
              head -c 30000 PREVALIDATION.md
              echo
              echo "Full files in the repository: DIGEST.md, candidates.json (includes feed excerpts), prevalidation.json."
              echo "To publish a deal, add it to observatory-data.json by hand with ver VERIFIED or REPORTED."
            } > "$RUNNER_TEMP/ISSUE_BODY.md"
            gh issue create \
              --title "Observatory watch: $COUNT new candidate(s) to review ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/ISSUE_BODY.md"
          fi

      - name: Commit results
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          git config user.name "observatory-watch"
          git config user.email "contact@aitransparencyinstitute.com"
          git add state/seen.json state/stories.json candidates.json DIGEST.md prevalidation.json PREVALIDATION.md observatory-data.json app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "watch: $(date -u +%F)"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
