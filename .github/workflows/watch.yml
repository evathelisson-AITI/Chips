name: Observatory source watch
on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: mkdir -p state
      - run: python watch.py

      - name: Commit results
        run: |
          git config user.name "observatory-watch"
          git config user.email "contact@aitransparencyinstitute.com"
          git add -A
          git diff --cached --quiet || git commit -m "watch: $(date -u +%F)"
          git push

      - name: Warn the human curator (GitHub issue)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('candidates.json'))))")
          if [ "$COUNT" -gt 0 ]; then
            gh issue create \
              --title "PENDING REVIEW: $COUNT new observatory entr(ies) await human verification ($(date -u +%F))" \
              --body-file DIGEST.md || true
          fi

      - name: Deploy observatory-data.json to the website
        if: ${{ env.FTP_HOST != '' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
            -e "set ssl:verify-certificate no; cd $FTP_DIR; put observatory-data.json; bye"
