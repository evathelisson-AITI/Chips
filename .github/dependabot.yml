# Keeps the SHA-pinned actions and the hash-pinned watcher dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
