          ]
          HINTS_JSON_EOF

      - name: Run source watch
        run: |
          mkdir -p state
          python "$RUNNER_TEMP/obs/watch.py"

      - name: Pre-validate (suggestions only, never touches ver)
        run: |
          HINTS=primary_hints.json
          [ -f "$HINTS" ] || HINTS="$RUNNER_TEMP/obs/primary_hints.seed.json"
          python "$RUNNER_TEMP/obs/prevalidate.py" --hints "$HINTS"

      # Issue BEFORE commit and WITHOUT "|| true": if the issue fails, the job fails
      # and state/seen.json is not committed, so the items come back next run.
      - name: Warn the human curator (GitHub issue)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('candidates.json'))))")
          echo "candidates=$COUNT prevalidation_chars=$(wc -c < PREVALIDATION.md)"
          if [ "$COUNT" -gt 0 ]; then
            head -c 60000 PREVALIDATION.md > "$RUNNER_TEMP/ISSUE_BODY.md"
            echo "" >> "$RUNNER_TEMP/ISSUE_BODY.md"
            echo "Full digest: DIGEST.md in the repository. Suggestions file: prevalidation.json." >> "$RUNNER_TEMP/ISSUE_BODY.md"
            gh issue create \
              --title "PENDING REVIEW: $COUNT new observatory entr(ies) ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/ISSUE_BODY.md"
          fi

      - name: Commit results
        run: |
          git config user.name "observatory-watch"
          git config user.email "contact@aitransparencyinstitute.com"
          git add -A
          git diff --cached --quiet || git commit -m "watch: $(date -u +%F)"
          git push

      - name: Deploy observatory-data.json to the website
        if: ${{ env.FTP_HOST != '' }}
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
            -e "set ssl:verify-certificate no; cd $FTP_DIR; put observatory-data.json; bye"
